<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyzt</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>xyzt</h1>
        <div class="toggle-container">
            <button id="mode-space" class="active">Space</button>
            <button id="mode-time">Time</button>
        </div>
        <select id="lang-selector" style="margin-top: 15px; background: #333; color: white; border: none; padding: 5px; border-radius: 5px;">
            <option value="en">EN</option>
            <option value="it">IT</option>
        </select>
    </header>

    <section class="publish-container" style="padding: 20px; max-width: 600px; margin: 0 auto;">
        <textarea id="post-content" data-i18n="placeholder" placeholder="What's happening?" rows="3"></textarea>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="file" id="post-media" accept="image/*" capture="environment" style="flex: 1; color: white;">
            <button id="btn-publish" data-i18n="post_btn">Publish</button>
        </div>
    </section>

    <main id="view-space" style="max-width: 600px; margin: 0 auto; padding: 0 20px;">
        <h2 data-i18n="space_title">Here and Now</h2>
        <div id="space-feed"></div> </main>

    <main id="view-time" style="display: none; max-width: 600px; margin: 0 auto; padding: 0 20px;">
		<h2 id="time-label-title">Time Label: <span id="current-label" style="color: var(--primary);"></span></h2>
		
		<div id="recent-labels" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
		
		<div id="time-feed"></div>
	</main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
